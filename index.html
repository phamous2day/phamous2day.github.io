    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
            --text:#e0e0e0;--muted:#888;--accent:#e8c547;--accent2:#4ecdc4;
            --warm:#d97757;
        }
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
        a{color:var(--accent);text-decoration:none;transition:color .2s}
        a:hover{color:var(--accent2)}

        /* HERO SECTION */
        .hero-section{position:relative;min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
        /* Background image class updated */
        .background-image{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80') center/cover;filter:brightness(.35)}
        .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.3) 0%,rgba(10,10,10,.95) 100%)}
        
        /* Gradient Orbs styling */
        .orbs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
        .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35;}
        .orb-1{width:350px;height:350px;background:var(--accent);top:10%;left:15%;}
        .orb-2{width:400px;height:400px;background:var(--accent2);bottom:10%;right:15%;}
